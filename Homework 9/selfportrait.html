<html> 
<head>
    <title>Self Portrait</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script>
            function setup() {
                createCanvas(500, 600);
                noLoop();
            }

            function draw() {
                background(220);
                    
    noStroke();
    fill(255, 224, 189);
    ellipse(200, 200, 160, 210);

    ellipse(200, 240, 120, 120);

    
noStroke();
fill(150, 90, 60);


rect(130, 110, 140, 35);


triangle(130, 110, 170, 85, 200, 110);
triangle(170, 110, 210, 80, 240, 110);
triangle(210, 110, 250, 90, 270, 110);


triangle(150, 110, 180, 95, 210, 110);
triangle(190, 110, 220, 85, 250, 110);
    
    noFill();
    stroke(0);
    strokeWeight(6);
    arc(200, 130, 200, 160, PI, TWO_PI);

 
    noStroke();
    fill(20);
    ellipse(120, 200, 50, 90);
    ellipse(280, 200, 50, 90);

   
    noFill();
    stroke(0);
    strokeWeight(2);
    rect(150, 170, 45, 35);
    rect(205, 170, 45, 35);
    line(195, 187, 205, 187);

   
    noStroke();
fill(255);
ellipse(172, 187, 25, 18);
ellipse(228, 187, 25, 18);

fill(80, 140, 255);
ellipse(172, 187, 12, 12);
ellipse(228, 187, 12, 12);


fill(0);
ellipse(172, 187, 6, 6);
ellipse(228, 187, 6, 6);

 
    fill(255, 224, 189);
    triangle(200, 190, 190, 215, 210, 215);

    
    stroke(0);
    strokeWeight(2);
    line(185, 235, 215, 235);

    
stroke(120);
strokeWeight(2);

for (let i = 0; i < 60; i++) {
    let x = random(160, 240);
    let y = random(230, 275);
    point(x, y);
}

for (let i = 0; i < 20; i++) {
    let x = random(170, 230);
    let y = random(215, 235);
    point(x, y);
}

   

   
    fill(0);
    textSize(16);
    text("Self Portrait", 140, 30);

    
    textSize(12);
    text("Philip", 290, 380);
}
    
           </script>
</head>
    <body></body>
</html>
